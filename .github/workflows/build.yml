name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $version"; exit 1; }
      - name: Build app
        run: ./make-app.sh
      - name: Self-tests (debug build; -O strips assert)
        run: swift build && .build/debug/Notchly --selftest
      - name: Snapshots
        run: build/Notchly.app/Contents/MacOS/Notchly --snapshot build/snapshots
      - uses: actions/upload-artifact@v4
        with: { name: snapshots, path: build/snapshots }
      - name: Zip
        run: |
          ditto -c -k --keepParent build/Notchly.app Notchly.zip
          shasum -a 256 Notchly.zip | tee Notchly.zip.sha256
      - uses: actions/upload-artifact@v4
        with: { name: Notchly, path: 'Notchly.zip*' }

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Notchly }
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: >
          gh release create "$GITHUB_REF_NAME" Notchly.zip Notchly.zip.sha256
          --repo "$GITHUB_REPOSITORY" --title "Notchly $GITHUB_REF_NAME" --generate-notes
